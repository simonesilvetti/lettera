[package]
name = "lettera-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
name = "lettera_core"

[dependencies]
ammonia = "4.2.4"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
futures = "0.3.34"
html2text = "0.17.4"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }
mail-builder = "1.0.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
notify = "8.2.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.9"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "test-util"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
